<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070908">
<title>ECHO — Context-Aware AI Companion</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070908;
  --panel:#0d110f;
  --panel2:#111612;
  --line:rgba(255,255,255,.08);
  --text:#f2f5f1;
  --muted:#89928b;
  --green:#a8ff4d;
  --green2:#c5ff8a;
  --danger:#d58f8f;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#1b291d 0,#080a09 38%,#030403 100%);
  color:var(--text);
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
}

.phone{
  width:100%;
  max-width:520px;
  min-height:100vh;
  position:relative;
  background:#080a09;
  overflow:hidden;
}

/* HEADER */

.header{
  height:72px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(8,10,9,.88);
  backdrop-filter:blur(20px);
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
}

.logoMark{
  width:30px;
  height:30px;
  border:1px solid var(--green);
  color:var(--green);
  border-radius:9px;
  display:grid;
  place-items:center;
  font-weight:900;
}

.logoText{
  font-weight:800;
  letter-spacing:.18em;
  font-size:14px;
}

.logoSub{
  display:block;
  color:#657068;
  font-size:7px;
  letter-spacing:.16em;
  margin-top:2px;
}

.mode{
  border:1px solid rgba(168,255,77,.2);
  background:rgba(168,255,77,.05);
  color:var(--green2);
  border-radius:30px;
  padding:7px 11px;
  font-size:9px;
  font-weight:800;
  letter-spacing:.12em;
}

/* CONTENT */

.content{
  padding:30px 20px 110px;
}

.eyebrow{
  color:#7f8981;
  font-size:9px;
  font-weight:800;
  letter-spacing:.16em;
}

.hero h1{
  font-size:43px;
  line-height:.96;
  letter-spacing:-.055em;
  margin-top:12px;
}

.hero h1 span{
  color:var(--green);
}

.hero p{
  margin-top:15px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
  max-width:410px;
}

/* ECHO ORB */

.orbArea{
  display:flex;
  justify-content:center;
  padding:28px 0 20px;
}

.orb{
  width:175px;
  height:175px;
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle,#203321 0,#101810 43%,#080b09 72%);
  border:1px solid rgba(168,255,77,.18);
  box-shadow:
    0 0 70px rgba(168,255,77,.07),
    inset 0 0 45px rgba(168,255,77,.05);
}

.orb:before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid rgba(168,255,77,.16);
  border-radius:50%;
  animation:pulse 3s ease-in-out infinite;
}

.orbCore{
  width:55px;
  height:55px;
  border-radius:50%;
  background:var(--green);
  filter:blur(15px);
  opacity:.5;
}

.orbText{
  position:absolute;
  bottom:25px;
  font-size:8px;
  letter-spacing:.2em;
  color:#aeb8b0;
}

@keyframes pulse{
  50%{
    transform:scale(1.08);
    opacity:.5;
  }
}

/* QUICK ACTIONS */

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.quick button{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px 7px;
  color:#d9dfda;
  font-size:11px;
}

.quick button:hover{
  border-color:rgba(168,255,77,.3);
}

/* CONVERSATION */

.contextTitle{
  margin-top:28px;
  margin-bottom:10px;
  color:#667067;
  font-size:9px;
  letter-spacing:.16em;
}

.chat{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message{
  max-width:85%;
  padding:12px 14px;
  border-radius:15px;
  font-size:13px;
  line-height:1.45;
}

.echo{
  background:var(--panel2);
  border:1px solid var(--line);
  align-self:flex-start;
}

.user{
  background:var(--green);
  color:#071006;
  font-weight:650;
  align-self:flex-end;
}

/* COMPOSER */

.composer{
  display:flex;
  gap:7px;
  margin-top:15px;
  background:#0d100e;
  border:1px solid var(--line);
  padding:7px;
  border-radius:17px;
}

.composer input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:0 8px;
  font-size:12px;
}

.composer input::placeholder{
  color:#59615c;
}

.composer button{
  width:39px;
  height:39px;
  border-radius:12px;
  border:0;
}

.mic{
  background:#171c18;
  color:white;
}

.send{
  background:var(--green);
  color:#081007;
}

/* MEMORY */

.section{
  margin-top:26px;
}

.sectionHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#687169;
  font-size:9px;
  letter-spacing:.14em;
}

.sectionHeader button{
  border:0;
  background:none;
  color:var(--green);
  font-size:10px;
}

.memory{
  margin-top:10px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
}

.memoryImage{
  height:150px;
  background:
    linear-gradient(135deg,#1b2a1c,#0b0f0c);
  display:grid;
  place-items:center;
  color:var(--green);
  font-weight:800;
  letter-spacing:.18em;
  overflow:hidden;
}

.memoryImage img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.memoryBody{
  padding:14px;
}

.memoryTitle{
  font-size:15px;
  font-weight:750;
}

.memoryDescription{
  margin-top:5px;
  color:#7e887f;
  font-size:11px;
  line-height:1.45;
}

.memoryMeta{
  margin-top:11px;
  color:#687169;
  font-size:9px;
}

.demoTag{
  display:inline-block;
  margin-left:7px;
  color:var(--green);
  background:rgba(168,255,77,.08);
  padding:4px 6px;
  border-radius:20px;
  font-size:7px;
  letter-spacing:.1em;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  width:min(520px,100%);
  height:76px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  background:rgba(8,10,9,.93);
  border-top:1px solid var(--line);
  backdrop-filter:blur(20px);
  z-index:30;
}

.nav{
  background:none;
  border:0;
  color:#687169;
  font-size:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}

.nav.active{
  color:var(--green);
}

.cameraButton{
  width:53px;
  height:53px;
  border-radius:17px;
  border:0;
  background:var(--green);
  color:#071006;
  justify-self:center;
  font-size:22px;
}

/* CAMERA */

.camera{
  position:fixed;
  inset:0;
  z-index:100;
  background:#030403;
  max-width:520px;
  margin:auto;
  overflow:hidden;
}

.camera video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cameraOverlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,.6),transparent 25%,transparent 65%,rgba(0,0,0,.85));
}

.cameraTop{
  position:absolute;
  top:18px;
  left:17px;
  right:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cameraTop button{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(0,0,0,.35);
  color:white;
}

.cameraTitle{
  font-size:9px;
  letter-spacing:.16em;
}

.scan{
  position:absolute;
  top:25%;
  left:12%;
  right:12%;
  height:36%;
  border:1px solid rgba(168,255,77,.35);
  border-radius:18px;
}

.corner{
  position:absolute;
  width:25px;
  height:25px;
  border-color:var(--green);
}

.c1{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}
.c2{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid}
.c3{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid}
.c4{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}

.cameraBottom{
  position:absolute;
  bottom:30px;
  left:20px;
  right:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.cameraAction{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.4);
  color:white;
  border-radius:12px;
  padding:11px 13px;
  font-size:10px;
}

.shutter{
  width:70px;
  height:70px;
  border-radius:50%;
  border:5px solid rgba(255,255,255,.7);
  background:var(--green);
}

/* PAGES */

.pageTitle{
  font-size:36px;
  letter-spacing:-.05em;
  margin-top:9px;
}

.pageDescription{
  margin-top:8px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.card{
  margin-top:18px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:19px;
  padding:17px;
}

.card h2{
  font-size:20px;
}

.card p{
  margin-top:7px;
  color:#858e87;
  font-size:12px;
  line-height:1.5;
}

.primary{
  width:100%;
  margin-top:16px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:#081007;
  font-size:12px;
  font-weight:800;
}

.radar{
  height:230px;
  border-radius:16px;
  background:radial-gradient(circle,#18251a,#090d0a 65%);
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  margin-bottom:20px;
}

.radarCircle{
  position:absolute;
  border:1px solid rgba(168,255,77,.13);
  border-radius:50%;
}

.r1{width:110px;height:110px}
.r2{width:190px;height:190px}

.radarDot{
  width:8px;
  height:8px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 20px var(--green);
}

.setting{
  padding:16px 0;
  border-bottom:1px solid var(--line);
}

.setting:last-child{
  border-bottom:0;
}

.setting strong{
  font-size:13px;
}

.setting p{
  color:#727b74;
  font-size:10px;
  margin-top:5px;
}

.toggle{
  float:right;
  width:44px;
  height:24px;
  border:0;
  border-radius:20px;
  background:#303630;
}

.toggle.on{
  background:var(--green);
}

.toggle span{
  display:block;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#888;
  margin:3px;
}

.toggle.on span{
  background:#071006;
  transform:translateX(19px);
}

.toast{
  position:fixed;
  bottom:91px;
  left:50%;
  transform:translateX(-50%);
  background:#edf5ed;
  color:#081007;
  padding:10px 15px;
  border-radius:30px;
  font-size:11px;
  font-weight:750;
  z-index:200;
  white-space:nowrap;
}

/* RESPONSIVE */

@media(min-width:700px){

  .phone{
    min-height:900px;
    margin:20px 0;
    border-radius:32px;
    border:1px solid var(--line);
  }

  .bottom{
    position:sticky;
  }

  .camera{
    border-radius:32px;
  }
}
</style>
</head>

<body>

<div class="app">
<div class="phone">

<header class="header">

  <div class="logo">

    <div class="logoMark">E</div>

    <div>
      <div class="logoText">ECHO</div>
      <span class="logoSub">CONTEXT-AWARE</span>
    </div>

  </div>

  <button class="mode" onclick="toggleDemo()">
    <span id="modeDot">●</span>
    <span id="modeText">DEMO</span>
  </button>

</header>


<main class="content" id="content"></main>


<nav class="bottom">

  <button class="nav active" onclick="showPage('home')" id="navHome">
    ◉
    <span>ECHO</span>
  </button>

  <button class="nav" onclick="showPage('memory')" id="navMemory">
    ◌
    <span>MEMORY</span>
  </button>

  <button class="cameraButton" onclick="openCamera()">
    ◉
  </button>

  <button class="nav" onclick="showPage('guide')" id="navGuide">
    ◎
    <span>GUIDE</span>
  </button>

  <button class="nav" onclick="showPage('settings')" id="navSettings">
    ⚙
    <span>MORE</span>
  </button>

</nav>

</div>
</div>


<script>

/* =========================================================
   ECHO — CONTEXT AWARE AI COMPANION
   Single-file hackathon prototype
   ========================================================= */


/* -----------------------------
   STATE
----------------------------- */

let demoMode = true;

let memories =
  JSON.parse(
    localStorage.getItem("echo_memories") || "[]"
  );

let selectedMemory = null;

let locationData = null;

let stream = null;


/* -----------------------------
   DEMO MEMORY
----------------------------- */

const demoMemory = {

  id:"demo-lab",

  title:"Electronics Laboratory",

  description:
    "Block B — Electronics Laboratory",

  visualContext:
    "College building entrance with a visible Block B / Electronics Laboratory sign.",

  ocrText:
    "BLOCK B • ELECTRONICS LABORATORY",

  latitude:13.0827,

  longitude:80.2707,

  timestamp:new Date().toISOString(),

  demo:true

};


/* -----------------------------
   INITIAL LOCATION
----------------------------- */

if(navigator.geolocation){

  navigator.geolocation.getCurrentPosition(

    position => {

      locationData = {

        latitude:position.coords.latitude,

        longitude:position.coords.longitude

      };

    },

    () => {}

  );

}


/* -----------------------------
   HELPERS
----------------------------- */

function getMemories(){

  let list = [...memories];

  if(
    demoMode &&
    !list.some(m => m.id === demoMemory.id)
  ){

    list.unshift(demoMemory);

  }

  return list;

}


function saveMemories(){

  localStorage.setItem(
    "echo_memories",
    JSON.stringify(memories)
  );

}


function toast(message){

  const element =
    document.createElement("div");

  element.className="toast";

  element.textContent=message;

  document.body.appendChild(element);

  setTimeout(
    () => element.remove(),
    2500
  );

}


function speak(text){

  if("speechSynthesis" in window){

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.rate=.95;

    utterance.pitch=1;

    speechSynthesis.speak(utterance);

  }

}


/* -----------------------------
   DEMO MODE
----------------------------- */

function toggleDemo(){

  demoMode=!demoMode;

  document.getElementById("modeText").textContent =
    demoMode ? "DEMO" : "LIVE";

  document.getElementById("modeDot").style.color =
    demoMode ? "#a8ff4d" : "#777";

  toast(
    demoMode
      ? "Demo Mode enabled"
      : "Live Mode enabled"
  );

}


/* -----------------------------
   PAGE SYSTEM
----------------------------- */

function showPage(page){

  document
    .querySelectorAll(".nav")
    .forEach(n => n.classList.remove("active"));

  if(page==="home")
    document.getElementById("navHome")
      .classList.add("active");

  if(page==="memory")
    document.getElementById("navMemory")
      .classList.add("active");

  if(page==="guide")
    document.getElementById("navGuide")
      .classList.add("active");

  if(page==="settings")
    document.getElementById("navSettings")
      .classList.add("active");

  if(page==="home")
    renderHome();

  if(page==="memory")
    renderMemory();

  if(page==="guide")
    renderGuide();

  if(page==="settings")
    renderSettings();

}


/* -----------------------------
   HOME
----------------------------- */

let messages=[

  {

    role:"echo",

    text:
      "Hi, I’m ECHO. Ask me what you see, remember a place, or find something you saw earlier."

  }

];


function renderHome(){

  const content =
    document.getElementById("content");

  const recent =
    getMemories()[0];

  content.innerHTML=`

    <section class="hero">

      <div class="eyebrow">
        YOUR CONTEXT LAYER
      </div>

      <h1>
        What do you<br>
        <span>need to know?</span>
      </h1>

      <p>
        ECHO connects what you say,
        see, remember and where you are.
      </p>

    </section>


    <div class="orbArea">

      <div class="orb">

        <div class="orbCore"></div>

        <div class="orbText">
          CONTEXT READY
        </div>

      </div>

    </div>


    <div class="quick">

      <button onclick="openCamera()">
        ◉ &nbsp; See
      </button>

      <button onclick="startVoice()">
        ● &nbsp; Ask
      </button>

      <button onclick="rememberDemo()">
        ◆ &nbsp; Remember
      </button>

    </div>


    <div class="contextTitle">
      LIVE CONTEXT
    </div>


    <div class="chat" id="chat">

      ${messages
        .slice(-5)
        .map(
          m => `
            <div class="message ${m.role}">
              ${escapeHTML(m.text)}
            </div>
          `
        )
        .join("")}

    </div>


    <form
      class="composer"
      onsubmit="sendMessage(event)"
    >

      <input
        id="messageInput"
        placeholder="Ask ECHO about this moment…"
        autocomplete="off"
      >

      <button
        type="button"
        class="mic"
        onclick="startVoice()"
      >
        ●
      </button>

      <button
        class="send"
        type="submit"
      >
        →
      </button>

    </form>


    <div class="section">

      <div class="sectionHeader">

        <span>RECENT MEMORY</span>

        <button onclick="showPage('memory')">
          VIEW ALL →
        </button>

      </div>


      ${
        recent
        ?

        `
        <button
          class="memory"
          style="width:100%;text-align:left;color:white"
          onclick="openMemory('${recent.id}')"
        >

          <div class="memoryImage">

            ${
              recent.image
              ?
              `<img src="${recent.image}">`
              :
              "ECHO MEMORY"
            }

          </div>

          <div class="memoryBody">

            <div class="memoryTitle">

              ${escapeHTML(recent.title)}

              ${
                recent.demo
                ?
                `<span class="demoTag">DEMO</span>`
                :
                ""
              }

            </div>

            <div class="memoryDescription">

              ${escapeHTML(recent.description)}

            </div>

            <div class="memoryMeta">

              ${recent.latitude
                ?
                `LOCATION · ${recent.latitude.toFixed(4)}, ${recent.longitude.toFixed(4)}`
                :
                "LOCATION NOT CAPTURED"
              }

            </div>

          </div>

        </button>
        `

        :

        `
        <div class="card">

          <p>
            Save a place and ECHO will
            carry that context forward.
          </p>

        </div>
        `

      }

    </div>

  `;

}


/* -----------------------------
   CHAT
----------------------------- */

function sendMessage(event){

  event.preventDefault();

  const input =
    document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text) return;

  input.value="";

  messages.push({

    role:"user",

    text:text

  });

  const answer =
    generateAnswer(text);

  messages.push({

    role:"echo",

    text:answer

  });

  renderHome();

  setTimeout(
    () => speak(answer),
    200
  );

}


function generateAnswer(text){

  const q=text.toLowerCase();

  const list=getMemories();

  if(
    q.includes("where") &&
    (
      q.includes("lab") ||
      q.includes("electronics")
    )
  ){

    selectedMemory =
      list.find(
        m =>
          m.title
            .toLowerCase()
            .includes("electronics")
      ) || list[0];

    return selectedMemory
      ?
      `You saved the ${selectedMemory.title} in ${selectedMemory.description}. I can use that saved context to guide you there.`
      :
      "I don't have a saved laboratory memory yet.";

  }


  if(
    q.includes("remember") ||
    q.includes("save")
  ){

    return "I can remember this moment. Use the Remember action to save the current visual context.";

  }


  if(
    q.includes("what") ||
    q.includes("front") ||
    q.includes("looking")
  ){

    if(demoMode){

      return "I can see a college building entrance. In Demo Mode, this is Block B, where the Electronics Laboratory is located.";

    }

    return "Open ECHO Vision and point your camera at the scene. I’ll analyze the current visual context.";

  }


  if(
    q.includes("guide") ||
    q.includes("direction")
  ){

    return "Open Guide to use the location saved with your selected ECHO memory.";

  }


  if(
    q.includes("read") ||
    q.includes("text")
  ){

    return "Open ECHO Vision and choose Read to inspect visible text.";

  }


  return "I’m ECHO. I connect what you say, see, remember and where you are so context can carry forward between interactions.";

}


/* -----------------------------
   VOICE
----------------------------- */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    toast(
      "Voice recognition isn't supported here. Type your request instead."
    );

    return;

  }

  const recognition =
    new SpeechRecognition();

  recognition.lang="en-IN";

  recognition.interimResults=false;

  recognition.onstart=()=>{

    toast("Listening…");

  };

  recognition.onerror=()=>{

    toast("I couldn't hear that. Try again.");

  };

  recognition.onresult=e=>{

    const text =
      e.results[0][0].transcript;

    const input =
      document.getElementById("messageInput");

    if(input){

      input.value=text;

      sendMessage(
        new Event("submit")
      );

    }else{

      messages.push({
        role:"user",
        text:text
      });

      messages.push({
        role:"echo",
        text:generateAnswer(text)
      });

      renderHome();

    }

  };

  recognition.start();

}


/* -----------------------------
   CAMERA
----------------------------- */

async function openCamera(){

  const camera =
    document.createElement("div");

  camera.className="camera";

  camera.innerHTML=`

    <video
      id="cameraVideo"
      autoplay
      playsinline
    ></video>

    <div class="cameraOverlay"></div>

    <div class="cameraTop">

      <button onclick="closeCamera()">
        ×
      </button>

      <div class="cameraTitle">
        ● ECHO VISION
      </div>

      <button onclick="switchCamera()">
        ↻
      </button>

    </div>


    <div class="scan">

      <span class="corner c1"></span>
      <span class="corner c2"></span>
      <span class="corner c3"></span>
      <span class="corner c4"></span>

    </div>


    <div class="cameraBottom">

      <button
        class="cameraAction"
        onclick="rememberCameraFrame()"
      >
        REMEMBER
      </button>

      <button
        class="shutter"
        onclick="analyzeCamera()"
      >
        ◉
      </button>

      <button
        class="cameraAction"
        onclick="readCamera()"
      >
        READ
      </button>

    </div>

  `;

  document.body.appendChild(camera);

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"environment"
        },

        audio:false

      });

    document
      .getElementById("cameraVideo")
      .srcObject=stream;

  }catch(error){

    const video =
      document.getElementById("cameraVideo");

    video.style.display="none";

    camera.insertAdjacentHTML(
      "beforeend",

      `
      <div style="
        position:absolute;
        top:42%;
        left:25px;
        right:25px;
        text-align:center;
        color:white;
        line-height:1.5;
        font-size:13px;
      ">

        Camera permission wasn't available.

        <br><br>

        <strong style="color:#a8ff4d">
          Demo Mode still works.
        </strong>

      </div>
      `

    );

  }

}


function closeCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(track=>track.stop());

    stream=null;

  }

  const camera =
    document.querySelector(".camera");

  if(camera)
    camera.remove();

}


function switchCamera(){

  toast(
    "Camera switching is available through browser/device controls."
  );

}


function captureFrame(){

  const video =
    document.getElementById("cameraVideo");

  if(
    !video ||
    !video.videoWidth
  )
    return null;

  const canvas =
    document.createElement("canvas");

  const scale =
    Math.min(
      1,
      1000 / video.videoWidth
    );

  canvas.width =
    video.videoWidth * scale;

  canvas.height =
    video.videoHeight * scale;

  canvas
    .getContext("2d")
    .drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

  return canvas.toDataURL(
    "image/jpeg",
    .8
  );

}


/* -----------------------------
   CAMERA ANALYSIS
----------------------------- */

function analyzeCamera(){

  const image =
    captureFrame();

  closeCamera();

  messages.push({

    role:"echo",

    text:
      demoMode
      ?
      "I can see a college building entrance. In Demo Mode, this is Block B, where the Electronics Laboratory is located."
      :
      "The image was captured. Connect an AI vision provider to perform live image understanding."

  });

  renderHome();

  if(image){

    selectedMemory={

      ...demoMemory,

      image:image,

      demo:false

    };

  }

  speak(
    demoMode
    ?
    "I can see a college building entrance. This is Block B, where the Electronics Laboratory is located."
    :
    "The image was captured."

  );

}


function readCamera(){

  const image =
    captureFrame();

  closeCamera();

  const answer =
    demoMode
    ?
    "I can read: BLOCK B — ELECTRONICS LABORATORY."
    :
    "The image was captured. Connect an AI vision provider to perform live OCR.";

  messages.push({

    role:"echo",

    text:answer

  });

  renderHome();

  speak(answer);

}


function rememberCameraFrame(){

  const image =
    captureFrame();

  closeCamera();

  createMemory(

    image,

    demoMode
    ?
    demoMemory
    :
    {

      title:"Saved visual moment",

      description:
        "A visual context saved from ECHO Vision.",

      visualContext:
        "Camera frame captured by the user.",

      ocrText:"",

      tags:["visual-memory"]

    }

  );

}


/* -----------------------------
   REMEMBER
----------------------------- */

function rememberDemo(){

  createMemory(

    null,

    demoMemory

  );

}


function createMemory(image,data){

  const memory={

    id:
      "memory-" +
      Date.now(),

    title:
      data.title ||
      "Saved moment",

    description:
      data.description ||
      "A place or visual context saved with ECHO.",

    visualContext:
      data.visualContext ||
      "",

    ocrText:
      data.ocrText ||
      "",

    tags:
      data.tags ||
      ["saved"],

    latitude:
      locationData
      ?.latitude ||
      data.latitude ||
      null,

    longitude:
      locationData
      ?.longitude ||
      data.longitude ||
      null,

    timestamp:
      new Date().toISOString(),

    image:
      image ||
      data.image ||
      null,

    demo:
      data===demoMemory

  };

  memories.unshift(memory);

  memories=memories.slice(0,30);

  saveMemories();

  selectedMemory=memory;

  toast(
    "Saved to ECHO memory"
  );

  showPage("memory");

}

/* -----------------------------
   ESCAPE HTML
----------------------------- */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
