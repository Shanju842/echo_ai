<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050705">
<title>ECHO — Context-Aware AI Companion</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#050705;
  --surface:#0b0f0c;
  --surface2:#101510;
  --surface3:#151b16;
  --line:rgba(255,255,255,.08);
  --text:#f3f7f2;
  --muted:#879188;
  --green:#a8ff4d;
  --green2:#caff9a;
  --red:#ff7777;
  --yellow:#ffd76a;
}

html,body{
  width:100%;
  min-height:100%;
  background:#020302;
}

body{
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color:var(--text);
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.app{
  min-height:100vh;
  display:flex;
  justify-content:center;
}

.phone{
  width:100%;
  max-width:540px;
  min-height:100vh;
  position:relative;
  background:
    radial-gradient(
      circle at 50% -15%,
      rgba(80,130,65,.24),
      transparent 38%
    ),
    #070907;
  overflow:hidden;
}

/* HEADER */

.header{
  height:72px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(7,9,7,.88);
  backdrop-filter:blur(22px);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:32px;
  height:32px;
  border-radius:10px;
  border:1px solid rgba(168,255,77,.55);
  display:grid;
  place-items:center;
  color:var(--green);
  font-size:16px;
  font-weight:900;
  box-shadow:0 0 22px rgba(168,255,77,.08);
}

.brandName{
  font-weight:900;
  letter-spacing:.18em;
  font-size:14px;
}

.brandSub{
  color:#5f6a62;
  font-size:7px;
  letter-spacing:.17em;
  margin-top:2px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid rgba(168,255,77,.18);
  background:rgba(168,255,77,.05);
  color:var(--green2);
  padding:7px 11px;
  border-radius:30px;
  font-size:9px;
  font-weight:800;
  letter-spacing:.1em;
}

.statusDot{
  width:6px;
  height:6px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 12px var(--green);
}

/* MAIN */

.content{
  padding:30px 20px 110px;
}

.eyebrow{
  color:#657067;
  font-size:9px;
  font-weight:800;
  letter-spacing:.18em;
}

.hero h1{
  font-size:44px;
  line-height:.96;
  letter-spacing:-.06em;
  margin-top:12px;
}

.hero h1 span{
  color:var(--green);
}

.hero p{
  margin-top:15px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
  max-width:420px;
}

/* ORB */

.orbArea{
  display:flex;
  justify-content:center;
  padding:30px 0 23px;
}

.orb{
  width:184px;
  height:184px;
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center;
  background:
    radial-gradient(
      circle,
      #253b25 0,
      #142015 38%,
      #090d09 72%
    );
  border:1px solid rgba(168,255,77,.18);
  box-shadow:
    0 0 90px rgba(168,255,77,.06),
    inset 0 0 55px rgba(168,255,77,.06);
}

.orb:before,
.orb:after{
  content:"";
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(168,255,77,.15);
}

.orb:before{
  inset:18px;
  animation:orbPulse 3s ease-in-out infinite;
}

.orb:after{
  inset:38px;
  border-color:rgba(168,255,77,.08);
  animation:orbPulse 2.4s ease-in-out infinite reverse;
}

.orbCore{
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--green);
  filter:blur(17px);
  opacity:.58;
  transition:.3s;
}

.orb.listening .orbCore{
  transform:scale(1.35);
  opacity:.9;
}

.orb.thinking .orbCore{
  animation:thinking 1s infinite alternate;
}

.orbText{
  position:absolute;
  bottom:26px;
  color:#9aa69d;
  font-size:8px;
  letter-spacing:.2em;
}

@keyframes orbPulse{
  50%{
    transform:scale(1.08);
    opacity:.5;
  }
}

@keyframes thinking{
  from{transform:scale(.8)}
  to{transform:scale(1.4)}
}

/* QUICK ACTIONS */

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.quick button{
  border:1px solid var(--line);
  background:var(--surface);
  color:#dce2dd;
  border-radius:15px;
  padding:14px 7px;
  font-size:11px;
  transition:.2s;
}

.quick button:hover{
  transform:translateY(-1px);
  border-color:rgba(168,255,77,.35);
  background:var(--surface2);
}

/* CHAT */

.contextTitle{
  margin-top:29px;
  margin-bottom:11px;
  color:#657067;
  font-size:9px;
  letter-spacing:.17em;
}

.chat{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message{
  max-width:87%;
  padding:12px 14px;
  border-radius:16px;
  font-size:13px;
  line-height:1.48;
  animation:messageIn .2s ease;
}

.echo{
  align-self:flex-start;
  background:var(--surface2);
  border:1px solid var(--line);
}

.user{
  align-self:flex-end;
  background:var(--green);
  color:#071006;
  font-weight:700;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(4px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* COMPOSER */

.composer{
  margin-top:15px;
  display:flex;
  gap:7px;
  padding:7px;
  border:1px solid var(--line);
  background:#0c100d;
  border-radius:18px;
}

.composer input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:0 8px;
  font-size:12px;
}

.composer input::placeholder{
  color:#586159;
}

.composer button{
  width:40px;
  height:40px;
  border-radius:12px;
  border:0;
}

.mic{
  background:#171c18;
  color:white;
}

.send{
  background:var(--green);
  color:#071006;
  font-weight:900;
}

/* CARDS */

.section{
  margin-top:28px;
}

.sectionHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#657067;
  font-size:9px;
  letter-spacing:.16em;
}

.sectionHeader button{
  border:0;
  background:none;
  color:var(--green);
  font-size:9px;
  font-weight:800;
}

.memory{
  margin-top:11px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:18px;
  overflow:hidden;
  transition:.2s;
}

.memory:hover{
  border-color:rgba(168,255,77,.2);
}

.memoryImage{
  height:155px;
  background:
    radial-gradient(
      circle at 50% 40%,
      #263d27,
      #0b100c 70%
    );
  display:grid;
  place-items:center;
  color:var(--green);
  font-size:9px;
  letter-spacing:.2em;
  overflow:hidden;
}

.memoryImage img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.memoryBody{
  padding:14px;
}

.memoryTitle{
  font-size:15px;
  font-weight:800;
}

.memoryDescription{
  margin-top:6px;
  color:#7f8981;
  font-size:11px;
  line-height:1.45;
}

.memoryMeta{
  margin-top:11px;
  color:#68736b;
  font-size:9px;
  line-height:1.6;
}

.tag{
  display:inline-block;
  margin-left:7px;
  padding:3px 6px;
  border-radius:20px;
  background:rgba(168,255,77,.08);
  color:var(--green);
  font-size:7px;
  letter-spacing:.1em;
}

/* PAGES */

.pageTitle{
  font-size:38px;
  line-height:1;
  letter-spacing:-.055em;
  margin-top:10px;
}

.pageDescription{
  margin-top:9px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.card{
  margin-top:18px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:19px;
  padding:17px;
}

.card h2{
  font-size:19px;
}

.card p{
  margin-top:7px;
  color:#7f8981;
  font-size:12px;
  line-height:1.5;
}

.primary{
  width:100%;
  margin-top:15px;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:#071006;
  padding:13px;
  font-size:11px;
  font-weight:900;
}

.secondary{
  width:100%;
  margin-top:8px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface2);
  color:#dbe2dc;
  padding:12px;
  font-size:11px;
}

/* RADAR */

.radar{
  height:225px;
  border-radius:17px;
  position:relative;
  overflow:hidden;
  display:grid;
  place-items:center;
  margin-bottom:20px;
  background:
    radial-gradient(
      circle,
      #18261a,
      #080c09 67%
    );
}

.radarCircle{
  position:absolute;
  border:1px solid rgba(168,255,77,.13);
  border-radius:50%;
}

.r1{
  width:105px;
  height:105px;
}

.r2{
  width:180px;
  height:180px;
}

.r3{
  width:280px;
  height:280px;
}

.radarDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 25px var(--green);
}

/* SETTINGS */

.setting{
  padding:16px 0;
  border-bottom:1px solid var(--line);
}

.setting:last-child{
  border-bottom:0;
}

.setting strong{
  font-size:13px;
}

.setting p{
  color:#707a72;
  font-size:10px;
  margin-top:5px;
}

.toggle{
  float:right;
  width:45px;
  height:25px;
  border:0;
  border-radius:20px;
  background:#303730;
}

.toggle span{
  display:block;
  width:19px;
  height:19px;
  margin:3px;
  border-radius:50%;
  background:#858d87;
  transition:.2s;
}

.toggle.on{
  background:var(--green);
}

.toggle.on span{
  background:#071006;
  transform:translateX(20px);
}

/* CAMERA */

.camera{
  position:fixed;
  inset:0;
  z-index:1000;
  background:#020302;
  max-width:540px;
  margin:auto;
  overflow:hidden;
}

.camera video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cameraShade{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      rgba(0,0,0,.6),
      transparent 25%,
      transparent 65%,
      rgba(0,0,0,.88)
    );
}

.cameraTop{
  position:absolute;
  top:18px;
  left:17px;
  right:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cameraTop button{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.4);
  color:white;
}

.cameraTitle{
  font-size:9px;
  letter-spacing:.17em;
}

.scan{
  position:absolute;
  top:25%;
  left:11%;
  right:11%;
  height:35%;
  border:1px solid rgba(168,255,77,.4);
  border-radius:18px;
}

.corner{
  position:absolute;
  width:27px;
  height:27px;
  border-color:var(--green);
}

.c1{
  top:-1px;
  left:-1px;
  border-top:2px solid;
  border-left:2px solid;
}

.c2{
  top:-1px;
  right:-1px;
  border-top:2px solid;
  border-right:2px solid;
}

.c3{
  bottom:-1px;
  left:-1px;
  border-bottom:2px solid;
  border-left:2px solid;
}

.c4{
  bottom:-1px;
  right:-1px;
  border-bottom:2px solid;
  border-right:2px solid;
}

.scanLine{
  position:absolute;
  left:4%;
  right:4%;
  top:20%;
  height:1px;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
  animation:scan 2.4s linear infinite;
}

@keyframes scan{
  0%{top:8%}
  50%{top:90%}
  100%{top:8%}
}

.cameraBottom{
  position:absolute;
  bottom:28px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cameraAction{
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.46);
  color:white;
  border-radius:12px;
  padding:11px 12px;
  font-size:9px;
  letter-spacing:.08em;
}

.shutter{
  width:72px;
  height:72px;
  border-radius:50%;
  border:5px solid rgba(255,255,255,.72);
  background:var(--green);
  color:#071006;
  font-size:20px;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:2000;
  left:50%;
  bottom:92px;
  transform:translateX(-50%);
  background:#edf5ed;
  color:#071006;
  padding:10px 15px;
  border-radius:30px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:1500;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(10px);
}

.modalBox{
  width:min(460px,100%);
  background:#0c100d;
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  box-shadow:0 25px 90px rgba(0,0,0,.55);
}

.modalBox h2{
  font-size:21px;
}

.modalBox p{
  margin-top:8px;
  color:#7e8980;
  font-size:12px;
  line-height:1.5;
}

.modalButtons{
  display:flex;
  gap:8px;
  margin-top:17px;
}

.modalButtons button{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--surface2);
  color:white;
}

.modalButtons .confirm{
  background:var(--green);
  color:#071006;
  border:0;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  width:min(540px,100%);
  height:76px;
  z-index:900;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  border-top:1px solid var(--line);
  background:rgba(7,9,7,.94);
  backdrop-filter:blur(22px);
}

.nav{
  border:0;
  background:none;
  color:#657067;
  font-size:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.nav.active{
  color:var(--green);
}

.navIcon{
  font-size:18px;
}

.cameraButton{
  width:54px;
  height:54px;
  justify-self:center;
  border:0;
  border-radius:17px;
  background:var(--green);
  color:#071006;
  font-size:21px;
  box-shadow:0 8px 35px rgba(168,255,77,.12);
}

/* DESKTOP */

@media(min-width:700px){
  .phone{
    min-height:900px;
    margin:20px 0;
    border:1px solid var(--line);
    border-radius:32px;
  }

  .bottom{
    position:sticky;
  }

  .camera{
    border-radius:32px;
  }
}
</style>
</head>

<body>

<div class="app">
<div class="phone">

<header class="header">

  <div class="brand">

    <div class="logo">E</div>

    <div>
      <div class="brandName">ECHO</div>
      <div class="brandSub">CONTEXT-AWARE AI</div>
    </div>

  </div>

  <button class="status" onclick="toggleDemo()">
    <span class="statusDot" id="statusDot"></span>
    <span id="statusText">DEMO</span>
  </button>

</header>

<main class="content" id="content"></main>

<nav class="bottom">

  <button
    class="nav active"
    id="navHome"
    onclick="showPage('home')"
  >
    <span class="navIcon">◉</span>
    <span>ECHO</span>
  </button>

  <button
    class="nav"
    id="navMemory"
    onclick="showPage('memory')"
  >
    <span class="navIcon">◌</span>
    <span>MEMORY</span>
  </button>

  <button
    class="cameraButton"
    onclick="openCamera()"
  >
    ◉
  </button>

  <button
    class="nav"
    id="navGuide"
    onclick="showPage('guide')"
  >
    <span class="navIcon">◎</span>
    <span>GUIDE</span>
  </button>

  <button
    class="nav"
    id="navSettings"
    onclick="showPage('settings')"
  >
    <span class="navIcon">⚙</span>
    <span>MORE</span>
  </button>

</nav>

</div>
</div>

<script>

/* ============================================================
   ECHO
   SINGLE-FILE CONTEXT-AWARE AI COMPANION
   ============================================================ */


/* ============================================================
   STATE
   ============================================================ */

let demoMode =
  localStorage.getItem("echo_demo") !== "false";

let memories =
  JSON.parse(
    localStorage.getItem("echo_memories") || "[]"
  );

let conversation =
  JSON.parse(
    localStorage.getItem("echo_conversation") || "[]"
  );

let selectedMemory = null;
let currentLocation = null;
let cameraStream = null;
let facingMode = "environment";


/* ============================================================
   DEMO DATA
   ============================================================ */

const DEMO_MEMORY = {

  id:"demo-electronics-lab",

  title:"Electronics Laboratory",

  description:
    "Block B — Electronics Laboratory",

  visualContext:
    "College building entrance with a visible Block B / Electronics Laboratory sign.",

  ocrText:
    "BLOCK B • ELECTRONICS LABORATORY",

  latitude:11.4966,

  longitude:77.2383,

  timestamp:new Date().toISOString(),

  demo:true,

  tags:[
    "college",
    "electronics",
    "laboratory"
  ]

};


/* ============================================================
   INITIALIZATION
   ============================================================ */

function init(){

  updateStatus();

  if(
    !conversation.length
  ){

    conversation.push({

      role:"echo",

      text:
        "Hi, I'm ECHO. I understand what you see, hear, remember and where you are. Try asking me something."

    });

    saveConversation();

  }

  requestLocation();

  renderHome();

}


/* ============================================================
   STORAGE
   ============================================================ */

function saveMemories(){

  localStorage.setItem(
    "echo_memories",
    JSON.stringify(memories)
  );

}

function saveConversation(){

  localStorage.setItem(
    "echo_conversation",
    JSON.stringify(
      conversation.slice(-50)
    )
  );

}


/* ============================================================
   MEMORY ACCESS
   ============================================================ */

function getMemories(){

  const list = [...memories];

  if(
    demoMode &&
    !list.some(
      m => m.id === DEMO_MEMORY.id
    )
  ){

    list.unshift(DEMO_MEMORY);

  }

  return list;

}


/* ============================================================
   LOCATION
   ============================================================ */

function requestLocation(){

  if(!navigator.geolocation)
    return;

  navigator.geolocation.getCurrentPosition(

    position => {

      currentLocation = {

        latitude:
          position.coords.latitude,

        longitude:
          position.coords.longitude,

        accuracy:
          position.coords.accuracy

      };

    },

    () => {}

  );

}


/* ============================================================
   STATUS
   ============================================================ */

function updateStatus(){

  document.getElementById(
    "statusText"
  ).textContent =
    demoMode ? "DEMO" : "LIVE";

  document.getElementById(
    "statusDot"
  ).style.background =
    demoMode
    ? "var(--green)"
    : "var(--yellow)";

}

function toggleDemo(){

  demoMode = !demoMode;

  localStorage.setItem(
    "echo_demo",
    String(demoMode)
  );

  updateStatus();

  toast(
    demoMode
    ? "Demo Mode enabled"
    : "Live Mode enabled"
  );

}


/* ============================================================
   TOAST
   ============================================================ */

function toast(message){

  const old =
    document.querySelector(".toast");

  if(old)
    old.remove();

  const element =
    document.createElement("div");

  element.className = "toast";

  element.textContent = message;

  document.body.appendChild(element);

  setTimeout(
    () => element.remove(),
    2500
  );

}


/* ============================================================
   SPEECH OUTPUT
   ============================================================ */

function speak(text){

  if(
    !("speechSynthesis" in window)
  )
    return;

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "en-IN";
  utterance.rate = .95;
  utterance.pitch = 1;

  speechSynthesis.speak(
    utterance
  );

}


/* ============================================================
   PAGE NAVIGATION
   ============================================================ */

function showPage(page){

  document
    .querySelectorAll(".nav")
    .forEach(
      n =>
        n.classList.remove("active")
    );

  const map = {

    home:"navHome",

    memory:"navMemory",

    guide:"navGuide",

    settings:"navSettings"

  };

  if(map[page]){

    document
      .getElementById(map[page])
      .classList.add("active");

  }

  if(page==="home")
    renderHome();

  if(page==="memory")
    renderMemory();

  if(page==="guide")
    renderGuide();

  if(page==="settings")
    renderSettings();

}

/* ============================================================
   CHAT
   ============================================================ */

async function sendMessage(event){

  event.preventDefault();

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if(!text)
    return;

  input.value = "";

  addMessage(
    "user",
    text
  );

  const orb =
    document.getElementById(
      "echoOrb"
    );

  if(orb)
    orb.classList.add("thinking");

  const answer =
    await generateAnswer(text);

  addMessage(
    "echo",
    answer
  );

  if(orb)
    orb.classList.remove("thinking");

  speak(answer);

}


/* ============================================================
   ADD MESSAGE
   ============================================================ */

function addMessage(
  role,
  text
){

  conversation.push({

    role:role,

    text:text,

    timestamp:
      new Date().toISOString()

  });

  saveConversation();

  renderHome();

}


/* ============================================================
   CONTEXT ENGINE
   ============================================================ */

async function generateAnswer(text){

  const q =
    text.toLowerCase();

  const list =
    getMemories();


  /* WHERE / LAB */

  if(
    q.includes("where") &&
    (
      q.includes("lab") ||
      q.includes("electronics")
    )
  ){

    const memory =
      list.find(
        m =>
          m.title
            .toLowerCase()
            .includes("electronics")
      );

    if(memory){

      selectedMemory =
        memory;

      return `
        You saved the Electronics Laboratory
        in Block B. I have its saved context
        and location. You can open Guide Me
        to navigate there.
      `;

    }

  }


  /* REMEMBER */

  if(
    q.includes("remember") ||
    q.includes("save this") ||
    q.includes("save it")
  ){

    return `
      Absolutely. Open ECHO Vision and tap
      Remember. I'll store the visual context,
      time and available location.
    `;

  }


  /* CAMERA */

  if(
    q.includes("see") ||
    q.includes("looking") ||
    q.includes("what is this") ||
    q.includes("what's this") ||
    q.includes("front of me")
  ){

    if(demoMode){

      return `
        I can see a college building entrance.
        In the demonstration context, this is
        Block B — Electronics Laboratory.
      `;

    }

    return `
      Open ECHO Vision and point your camera
      at the scene. I'll use the captured
      context to answer.
    `;

  }


  /* TEXT */

  if(
    q.includes("read") ||
    q.includes("text") ||
    q.includes("sign")
  ){

    return `
      Open ECHO Vision and choose READ.
      In Demo Mode I can recognize the
      Electronics Laboratory sign.
    `;

  }


  /* GUIDE */

  if(
    q.includes("guide") ||
    q.includes("direction") ||
    q.includes("navigate")
  ){

    return `
      Open Guide. ECHO will use the location
      attached to your selected memory.
    `;

  }


  /* MEMORY */

  if(
    q.includes("memory") ||
    q.includes("memories") ||
    q.includes("earlier") ||
    q.includes("before")
  ){

    if(list.length){

      return `
        You currently have
        ${list.length}
        available context memories.
        Open Memory to explore them.
      `;

    }

    return `
      You don't have any saved memories yet.
    `;

  }


  /* LOCATION */

  if(
    q.includes("location") ||
    q.includes("where am i")
  ){

    if(currentLocation){

      return `
        I have access to your current browser
        location. Your coordinates are
        ${currentLocation.latitude.toFixed(4)},
        ${currentLocation.longitude.toFixed(4)}.
      `;

    }

    return `
      Location isn't available yet. Please
      allow location permission in your browser.
    `;

  }


  /* DEFAULT */

  return `
    I'm ECHO — your context-aware companion.
    I can help you understand what you see,
    remember places and moments, use location
    context and guide you back to saved places.
  `;

}


/* ============================================================
   VOICE INPUT
   ============================================================ */

function startVoice(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!Recognition){

    toast(
      "Voice recognition is not supported here."
    );

    return;

  }

  const recognition =
    new Recognition();

  recognition.lang =
    "en-IN";

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart = () => {

    const orb =
      document.getElementById(
        "echoOrb"
      );

    if(orb)
      orb.classList.add("listening");

    toast("Listening…");

  };


  recognition.onend = () => {

    const orb =
      document.getElementById(
        "echoOrb"
      );

    if(orb)
      orb.classList.remove("listening");

  };


  recognition.onerror = () => {

    toast(
      "I couldn't hear that. Try again."
    );

  };


  recognition.onresult = event => {

    const text =
      event.results[0][0].transcript;

    const input =
      document.getElementById(
        "messageInput"
      );

    if(input){

      input.value = text;

      sendMessage(
        new Event("submit")
      );

    }

  };


  recognition.start();

}

async function openCamera(){

  const camera =
    document.createElement("div");

  camera.className =
    "camera";

  camera.innerHTML = `

    <video
      id="cameraVideo"
      autoplay
      playsinline
    ></video>

    <div class="cameraShade"></div>


    <div class="cameraTop">

      <button onclick="closeCamera()">
        ×
      </button>

      <div class="cameraTitle">
        ● ECHO VISION
      </div>

      <button onclick="switchCamera()">
        ↻
      </button>

    </div>


    <div class="scan">

      <div class="scanLine"></div>

      <span class="corner c1"></span>
      <span class="corner c2"></span>
      <span class="corner c3"></span>
      <span class="corner c4"></span>

    </div>


    <div class="cameraBottom">

      <button
        class="cameraAction"
        onclick="rememberCameraFrame()"
      >
        REMEMBER
      </button>


      <button
        class="shutter"
        onclick="analyzeCamera()"
      >
        ◉
      </button>


      <button
        class="cameraAction"
        onclick="readCamera()"
      >
        READ
      </button>

    </div>

  `;

  document.body.appendChild(camera);


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    showCameraFallback();

    return;

  }


  try{

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:facingMode
        },

        audio:false

      });


    const video =
      document.getElementById(
        "cameraVideo"
      );

    video.srcObject =
      cameraStream;

  }

  catch(error){

    showCameraFallback();

  }

}


/* ============================================================
   CAMERA FALLBACK
   ============================================================ */

function showCameraFallback(){

  const video =
    document.getElementById(
      "cameraVideo"
    );

  if(video)
    video.style.display="none";

  const camera =
    document.querySelector(
      ".camera"
    );

  if(!camera)
    return;

  camera.insertAdjacentHTML(

    "beforeend",

    `

      <div style="
        position:absolute;
        top:40%;
        left:25px;
        right:25px;
        text-align:center;
        color:white;
        line-height:1.6;
        font-size:13px;
      ">

        Camera permission isn't available.

        <br><br>

        <strong style="
          color:#a8ff4d
        ">
          Demo Mode is still available.
        </strong>

      </div>

    `

  );

}


/* ============================================================
   CLOSE CAMERA
   ============================================================ */

function closeCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    cameraStream=null;

  }

  const camera =
    document.querySelector(
      ".camera"
    );

  if(camera)
    camera.remove();

}


/* ============================================================
   SWITCH CAMERA
   ============================================================ */

async function switchCamera(){

  facingMode =
    facingMode === "environment"
    ?
    "user"
    :
    "environment";

  closeCamera();

  await openCamera();

}


/* ============================================================
   CAPTURE FRAME
   ============================================================ */

function captureFrame(){

  const video =
    document.getElementById(
      "cameraVideo"
    );

  if(
    !video ||
    !video.videoWidth
  )
    return null;


  const canvas =
    document.createElement(
      "canvas"
    );

  const scale =
    Math.min(
      1,
      1000 / video.videoWidth
    );

  canvas.width =
    Math.round(
      video.videoWidth * scale
    );

  canvas.height =
    Math.round(
      video.videoHeight * scale
    );


  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(

    video,

    0,
    0,

    canvas.width,
    canvas.height

  );


  return canvas.toDataURL(
    "image/jpeg",
    .82
  );

}


/* ============================================================
   ANALYZE CAMERA
   ============================================================ */

function analyzeCamera(){

  const image =
    captureFrame();

  closeCamera();


  let answer;

  if(demoMode){

    answer =
      "I can see a college building entrance. The demonstration context identifies it as Block B — Electronics Laboratory.";

  }

  else{

    answer =
      "I've captured the scene. To perform live AI vision analysis, connect ECHO to your secure AI endpoint.";

  }


  addMessage(
    "echo",
    answer
  );

  speak(answer);


  if(image){

    selectedMemory = {

      ...DEMO_MEMORY,

      id:
        "capture-" +
        Date.now(),

      image:image,

      demo:false,

      timestamp:
        new Date().toISOString()

    };

  }

}

/* ============================================================
   CREATE MEMORY
   ============================================================ */

function createMemory(
  image,
  data
){

  const memory = {

    id:
      "memory-" +
      Date.now(),

    title:
      data.title ||
      "Saved moment",

    description:
      data.description ||
      "A context saved by ECHO.",

    visualContext:
      data.visualContext ||
      "",

    ocrText:
      data.ocrText ||
      "",

    tags:
      data.tags ||
      ["saved"],

    latitude:
      currentLocation
      ?.latitude
      ??
      data.latitude
      ??
      null,

    longitude:
      currentLocation
      ?.longitude
      ??
      data.longitude
      ??
      null,

    timestamp:
      new Date().toISOString(),

    image:
      image ||
      data.image ||
      null,

    demo:
      data === DEMO_MEMORY

  };


  memories.unshift(
    memory
  );

  memories =
    memories.slice(0,30);

  saveMemories();

  selectedMemory =
    memory;

  toast(
    "Saved to ECHO memory"
  );

  showPage("memory");

}

    <div class="card">

      <div class="eyebrow">
        PRIVACY BY DESIGN
      </div>

      <p>
        ECHO requests camera,
        microphone and location only
        when needed. Prototype memories
        are stored locally in the browser.
      </p>

    </div>


    <div class="card">

      <div class="eyebrow">
        AI CONNECTION
      </div>

      <p>
        This standalone build works in
        Demo Mode without an API key.
        For production AI, connect a
        secure backend endpoint rather
        than exposing an API key here.
      </p>

    </div>

  `;

}


/* ============================================================
   CLEAR MEMORY
   ============================================================ */

function clearMemories(){

  if(
    !confirm(
      "Delete all saved ECHO memories?"
    )
  )
    return;

  memories=[];

  localStorage.removeItem(
    "echo_memories"
  );

  selectedMemory=null;

  toast(
    "Memories cleared"
  );

  renderSettings();

}


/* ============================================================
   CLEAR CONVERSATION
   ============================================================ */

function clearConversation(){

  if(
    !confirm(
      "Clear the ECHO conversation?"
    )
  )
    return;

  conversation=[];

  conversation.push({

    role:"echo",

    text:
      "Conversation cleared. I'm ready."

  });

  saveConversation();

  toast(
    "Conversation cleared"
  );

  renderHome();

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ============================================================
   START
   ============================================================ */

init();
